# Run FinXL on one machine:  docker compose -f deploy/docker-compose.yml up -d --build
# Then open http://localhost:8000. Settings come from deploy/.env (copy .env.example).
services:
  finxl:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: finxl:1.0.0-beta
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - finxl-data:/data   # runs, the library database and the PDF cache
    restart: unless-stopped

volumes:
  finxl-data:
